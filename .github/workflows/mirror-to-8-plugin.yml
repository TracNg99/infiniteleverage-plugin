name: Mirror plugin payload to infiniteleverage-8-plugin

on:
  push:
    branches:
      - main
    paths:
      - "plugin/**"
      - ".claude-plugin/**"
      - "README.md"
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4

      - name: Clone target repo
        run: |
          git clone https://x-access-token:${{ secrets.PLUGIN_SYNC_TOKEN }}@github.com/talentedgeai/infiniteleverage-8-plugin.git target

      - name: Mirror plugin/ directory
        run: rsync -a --delete plugin/ target/plugin/

      - name: Mirror .claude-plugin/ directory
        run: rsync -a --delete .claude-plugin/ target/.claude-plugin/

      - name: Mirror README.md
        run: cp README.md target/README.md

      - name: Commit and push to mirror
        working-directory: target
        run: |
          git config user.name "il-plugin-sync[bot]"
          git config user.email "il-plugin-sync@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "already in sync — nothing to push"
            exit 0
          fi
          git commit -m "sync: mirror from infiniteleverage-plugin@${{ github.sha }}"
          git push origin main
